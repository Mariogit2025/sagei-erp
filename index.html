<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGEI ERP 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}
body{background:#08111f;color:#fff;overflow-x:hidden;}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 20px;background:radial-gradient(circle at top,#1d4ed8 0%,#08111f 55%),#08111f;}
.logo{width:260px;max-width:85%;margin-bottom:30px;}
h1{font-size:72px;font-weight:800;margin-bottom:10px;}
.subtitulo{font-size:24px;color:#dbe4f0;max-width:900px;margin-bottom:30px;}
.modulos{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.modulo{background:rgba(255,255,255,.08);padding:12px 20px;border-radius:50px;backdrop-filter:blur(10px);font-size:14px;}
.botones{display:flex;gap:15px;margin-top:40px;flex-wrap:wrap;justify-content:center;}
.btn{padding:15px 35px;border-radius:50px;text-decoration:none;font-weight:600;transition:.3s;}
.btn-primary{background:#2563eb;color:white;}
.btn-secondary{border:1px solid rgba(255,255,255,.3);color:white;}
section{padding:90px 8%;}
.titulo-seccion{font-size:48px;text-align:center;margin-bottom:20px;}
.texto-seccion{text-align:center;max-width:900px;margin:auto;color:#cbd5e1;font-size:18px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;margin-top:60px;}
.stat-card{background:#111827;padding:35px;border-radius:20px;text-align:center;border:1px solid rgba(255,255,255,.08);}
.stat-card h3{font-size:42px;color:#60a5fa;}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:35px;margin-top:50px;}
.card{background:#111827;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:.3s;cursor:pointer;}
.card:hover{transform:translateY(-10px);box-shadow:0 15px 40px rgba(37,99,235,.15);}
.card img{width:100%;height:320px;object-fit:cover;display:block;cursor:zoom-in;transition:.35s;}
.card:hover img{transform:scale(1.03);}
.card-body{padding:25px;}
.footer{padding:60px 8%;background:#050b16;text-align:center;border-top:1px solid rgba(255,255,255,.08);}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);justify-content:center;align-items:center;z-index:999999;}
.lightbox img{max-width:95%;max-height:95%;border-radius:12px;}
@media(max-width:768px){
h1{font-size:44px;}
.titulo-seccion{font-size:34px;}
.galeria{grid-template-columns:1fr;}
.card img{height:240px;}
}
</style>
</head>
<body>

<section class="hero">
<img src="assets/logo/Logo_Sagei_2026.png" class="logo">
<h1>SAGEI ERP</h1>
<p class="subtitulo">ERP Administrativo, Comercial y Contable diseñado para integrar toda la operación de su empresa en una sola plataforma.</p>
</section>

<section id="modulos">
<h2 class="titulo-seccion">Módulos Principales</h2>

<div class="galeria">
<div class="card"><img src="assets/screenshots/facturacion.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Facturación Electrónica FEL</h3></div></div>
<div class="card"><img src="assets/screenshots/existencias.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Inventarios y Existencias</h3></div></div>
<div class="card"><img src="assets/screenshots/credito.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Créditos y Cobranza</h3></div></div>
<div class="card"><img src="assets/screenshots/estado-cuenta.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Estado de Cuenta</h3></div></div>
<div class="card"><img src="assets/screenshots/bancos.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Bancos</h3></div></div>
<div class="card"><img src="assets/screenshots/balance.jpg" onclick="abrirImagen(this.src)"><div class="card-body"><h3>Contabilidad</h3></div></div>
</div>
</section>

<div id="lightbox" class="lightbox" onclick="cerrarImagen()">
<img id="imagenGrande" src="">
</div>

<script>
function abrirImagen(src){
 document.getElementById('imagenGrande').src = src;
 document.getElementById('lightbox').style.display = 'flex';
}
function cerrarImagen(){
 document.getElementById('lightbox').style.display = 'none';
}
</script>

</body>
</html>
